<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1d3a"/>
      <stop offset="55%" stop-color="#1c1630"/>
      <stop offset="100%" stop-color="#0b0b12"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e2a4a"/>
      <stop offset="100%" stop-color="#15131f"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Piste arc-en-ciel -->
  <path d="M0 330 Q400 240 800 310 L800 450 L0 450 Z" fill="#141219"/>

  <!-- Bandes colorées -->
  <path d="M0 340 Q400 250 800 320 L800 350 Q400 272 0 362 Z" fill="#6d4cff" opacity="0.85"/>
  <path d="M0 362 Q400 272 800 350 L800 375 Q400 294 0 384 Z" fill="#315cff" opacity="0.85"/>
  <path d="M0 384 Q400 294 800 375 L800 398 Q400 314 0 404 Z" fill="#f5c04a" opacity="0.85"/>
  <path d="M0 404 Q400 314 800 398 L800 420 Q400 334 0 424 Z" fill="#3ec9a7" opacity="0.85"/>
  <path d="M0 424 Q400 334 800 420 L800 450 Q400 354 0 450 Z" fill="#f0656a" opacity="0.85"/>

  <!-- Traces de vitesse -->
  <g stroke="#ffffff" stroke-linecap="round" opacity="0.35">
    <line x1="180" y1="300" x2="180" y2="250"/>
    <line x1="280" y1="280" x2="280" y2="230"/>
    <line x1="520" y1="300" x2="520" y2="250"/>
    <line x1="600" y1="310" x2="600" y2="265"/>
  </g>

  <!-- Point de départ -->
  <g transform="translate(400 285)">
    <rect x="-46" y="-14" width="92" height="28" rx="5" fill="#ffffff" opacity="0.12" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#ffffff" opacity="0.9">GO</text>
  </g>

  <circle cx="160" cy="120" r="60" fill="#f0656a" opacity="0.4"/>
  <circle cx="660" cy="110" r="50" fill="#315cff" opacity="0.4"/>
  <circle cx="300" cy="90" r="3" fill="#ffffff" opacity="0.6"/>
  <circle cx="520" cy="140" r="2.5" fill="#ffffff" opacity="0.5"/>
</svg>