<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16202a"/>
      <stop offset="55%" stop-color="#121b24"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </linearGradient>
    <radialGradient id="fog" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3ec9a7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3ec9a7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="building" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e3a44"/>
      <stop offset="100%" stop-color="#1a242e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="400" cy="220" r="300" fill="url(#fog)"/>

  <!-- Bâtiments hantés -->
  <g transform="translate(240 180)">
    <rect x="0" y="60" width="80" height="90" rx="4" fill="url(#building)"/>
    <rect x="-14" y="30" width="30" height="120" rx="4" fill="url(#building)"/>
    <rect x="66" y="48" width="26" height="102" rx="4" fill="url(#building)"/>
    <rect x="-4" y="86" width="18" height="22" rx="3" fill="#3ec9a7" opacity="0.7"/>
    <rect x="34" y="70" width="18" height="22" rx="3" fill="#3ec9a7" opacity="0.5"/>
    <rect x="72" y="96" width="14" height="18" rx="3" fill="#3ec9a7" opacity="0.6"/>
  </g>

  <g transform="translate(500 200)">
    <rect x="0" y="50" width="70" height="100" rx="4" fill="url(#building)"/>
    <rect x="-12" y="20" width="28" height="130" rx="4" fill="url(#building)"/>
    <rect x="58" y="60" width="24" height="90" rx="4" fill="url(#building)"/>
    <rect x="10" y="80" width="16" height="20" rx="3" fill="#3ec9a7" opacity="0.6"/>
    <rect x="40" y="62" width="16" height="20" rx="3" fill="#3ec9a7" opacity="0.5"/>
  </g>

  <!-- Brouillard -->
  <path d="M0 340 Q200 300 400 330 Q600 360 800 320 L800 450 L0 450 Z" fill="#0e1418" opacity="0.85"/>
  <ellipse cx="200" cy="340" rx="200" ry="40" fill="#2a3a3e" opacity="0.5"/>
  <ellipse cx="620" cy="350" rx="220" ry="45" fill="#243236" opacity="0.5"/>

  <!-- Lune -->
  <circle cx="660" cy="110" r="34" fill="#d8e4dc" opacity="0.85"/>
  <circle cx="652" cy="104" r="30" fill="#16202a"/>

  <!-- Corbeaux -->
  <g fill="#0c0f12">
    <path d="M140 160 q-8 -12 -16 -2 q8 -4 16 2 M124 160 q8 -12 16 -2 q-8 -4 -16 2"/>
    <path d="M180 130 q-7 -11 -14 -2 q7 -4 14 2 M166 130 q7 -11 14 -2 q-7 -4 -14 2"/>
  </g>

  <circle cx="300" cy="120" r="2.5" fill="#3ec9a7" opacity="0.8"/>
  <circle cx="430" cy="150" r="3" fill="#3ec9a7" opacity="0.6"/>
</svg>