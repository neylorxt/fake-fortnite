<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1c38"/>
      <stop offset="55%" stop-color="#16152a"/>
      <stop offset="100%" stop-color="#0b0b12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6d4cff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6d4cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3755"/>
      <stop offset="100%" stop-color="#242140"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="400" cy="200" r="280" fill="url(#glow)"/>

  <!-- Mur de l'arène -->
  <path d="M100 140 Q400 60 700 140 L700 320 Q400 360 100 320 Z" fill="#1a1828" stroke="#3a3755" stroke-width="3"/>
  <path d="M140 170 Q400 100 660 170 L660 300 Q400 335 140 300 Z" fill="url(#wall)"/>

  <!-- Lignes de l'arène -->
  <ellipse cx="400" cy="220" rx="240" ry="50" fill="none" stroke="#6d4cff" stroke-width="2" opacity="0.6"/>
  <ellipse cx="400" cy="220" rx="170" ry="36" fill="none" stroke="#6d4cff" stroke-width="2" opacity="0.4"/>
  <line x1="400" y1="120" x2="400" y2="310" stroke="#6d4cff" stroke-width="2" opacity="0.5"/>

  <!-- Combattants -->
  <g transform="translate(300 220)">
    <circle cx="0" cy="0" r="26" fill="#f5c04a"/>
    <rect x="-26" y="24" width="52" height="22" rx="6" fill="#2c2940"/>
    <path d="M-16 -14 q8 -22 16 0 q-4 4 -16 4 Z" fill="#2c2940"/>
    <circle cx="0" cy="-34" r="14" fill="#3a3755"/>
  </g>
  <g transform="translate(500 220)">
    <circle cx="0" cy="0" r="26" fill="#315cff"/>
    <rect x="-26" y="24" width="52" height="22" rx="6" fill="#2c2940"/>
    <path d="M-16 -14 q8 -22 16 0 q-4 4 -16 4 Z" fill="#2c2940"/>
    <circle cx="0" cy="-34" r="14" fill="#3a3755"/>
  </g>

  <!-- Éclaboussures -->
  <g fill="#f5c04a" opacity="0.7">
    <circle cx="260" cy="200" r="4"/>
    <circle cx="250" cy="215" r="3"/>
    <circle cx="265" cy="230" r="2.5"/>
  </g>
  <g fill="#315cff" opacity="0.7">
    <circle cx="540" cy="200" r="4"/>
    <circle cx="550" cy="215" r="3"/>
    <circle cx="535" cy="230" r="2.5"/>
  </g>

  <!-- Lumières -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="180" cy="180" r="4"/>
    <circle cx="620" cy="180" r="4"/>
    <circle cx="400" cy="150" r="4"/>
  </g>

  <circle cx="300" cy="100" r="2.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="540" cy="110" r="3" fill="#ffffff" opacity="0.4"/>
</svg>