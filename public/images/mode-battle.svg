<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d1c3a"/>
      <stop offset="55%" stop-color="#17162e"/>
      <stop offset="100%" stop-color="#0b0b12"/>
    </linearGradient>
    <radialGradient id="sky" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6d4cff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6d4cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="island" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a465c"/>
      <stop offset="100%" stop-color="#262338"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#201d33"/>
      <stop offset="100%" stop-color="#0b0b12"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="400" cy="220" r="260" fill="url(#sky)"/>

  <!-- Île flottante principale -->
  <g transform="translate(400 190)">
    <path d="M-240 40 Q-190 -80 -60 -90 Q80 -100 180 -20 Q240 30 200 80 Q120 130 -110 120 Q-220 110 -240 40 Z" fill="url(#island)"/>
    <path d="M-110 -80 Q-80 -150 30 -160 Q110 -166 150 -90 Q60 -110 -40 -140 Z" fill="#55516a"/>
    <path d="M-160 70 L180 110 L185 130 L-170 92 Z" fill="#0a0a12" opacity="0.5"/>
    <g fill="#2c293f">
      <rect x="-150" y="30" width="80" height="55" rx="6"/>
      <rect x="-50" y="20" width="95" height="50" rx="6"/>
      <rect x="60" y="32" width="72" height="52" rx="6"/>
    </g>
  </g>

  <!-- Îles secondaires -->
  <g transform="translate(120 300)">
    <path d="M-80 20 Q-60 -40 0 -45 Q60 -50 90 10 Q110 40 80 55 Q0 70 -70 55 Q-90 45 -80 20 Z" fill="#322f47"/>
    <rect x="-45" y="0" width="45" height="30" rx="4" fill="#262339"/>
  </g>
  <g transform="translate(700 320)">
    <path d="M-90 20 Q-70 -45 -5 -50 Q60 -55 95 5 Q115 40 80 55 Q-5 70 -80 55 Q-100 45 -90 20 Z" fill="#36334c"/>
    <rect x="-40" y="-2" width="50" height="32" rx="4" fill="#2a2740"/>
  </g>

  <!-- Sol -->
  <path d="M0 380 Q300 350 800 375 L800 450 L0 450 Z" fill="url(#ground)"/>
  <circle cx="560" cy="405" r="52" fill="#6d4cff" opacity="0.28"/>
  <circle cx="560" cy="405" r="38" fill="#6d4cff" opacity="0.2"/>

  <!-- Nuages -->
  <ellipse cx="180" cy="120" rx="110" ry="20" fill="#ffffff" opacity="0.07"/>
  <ellipse cx="620" cy="90" rx="130" ry="22" fill="#ffffff" opacity="0.06"/>
</svg>