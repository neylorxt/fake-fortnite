<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3013"/>
      <stop offset="40%" stop-color="#2e2610"/>
      <stop offset="100%" stop-color="#14110a"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f3515"/>
      <stop offset="100%" stop-color="#191505"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Perspective des couloirs -->
  <g>
    <polygon points="400,450 120,180 680,180" fill="url(#floor)"/>
    <path d="M120 180 L400 450 L680 180 Z" stroke="#f5c04a" stroke-opacity="0.5" stroke-width="3" fill="none"/>
    <path d="M300 320 L500 320" stroke="#f5c04a" stroke-opacity="0.4" stroke-width="2"/>
    <path d="M230 250 L570 250" stroke="#f5c04a" stroke-opacity="0.3" stroke-width="2"/>
    <path d="M340 390 L460 390" stroke="#f5c04a" stroke-opacity="0.35" stroke-width="2"/>
  </g>

  <!-- Murs -->
  <path d="M120 180 L120 0 L680 0 L680 180 Q400 80 120 180 Z" fill="#3a3013"/>
  <path d="M120 180 L680 180 Q400 80 120 180 Z" fill="#2e2610"/>

  <!-- Portes -->
  <g fill="#0d0b06">
    <rect x="200" y="20" width="46" height="90" rx="4"/>
    <rect x="330" y="10" width="60" height="100" rx="4"/>
    <rect x="470" y="25" width="50" height="95" rx="4"/>
    <rect x="590" y="15" width="42" height="88" rx="4"/>
  </g>

  <!-- Moulures -->
  <g stroke="#f5c04a" stroke-opacity="0.4">
    <line x1="120" y1="130" x2="680" y2="130"/>
    <line x1="200" y1="115" x2="200" y2="20"/>
    <line x1="246" y1="115" x2="246" y2="20"/>
    <line x1="330" y1="112" x2="330" y2="10"/>
    <line x1="390" y1="112" x2="390" y2="10"/>
    <line x1="470" y1="120" x2="470" y2="25"/>
    <line x1="520" y1="120" x2="520" y2="25"/>
    <line x1="590" y1="103" x2="590" y2="15"/>
    <line x1="632" y1="103" x2="632" y2="15"/>
  </g>

  <!-- Vignette -->
  <rect width="800" height="450" fill="#000000" opacity="0.25"/>

  <!-- Silhouette -->
  <g transform="translate(400 320)">
    <circle cx="0" cy="-30" r="18" fill="#0c0a05"/>
    <path d="M-14 -10 Q-20 30 -26 60 L26 60 Q20 30 14 -10 Z" fill="#0c0a05"/>
  </g>

  <text x="560" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="30" fill="#f5c04a" opacity="0.35" transform="rotate(-8 560 280)">??</text>
</svg>