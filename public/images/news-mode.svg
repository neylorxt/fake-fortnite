<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1b3a"/>
      <stop offset="50%" stop-color="#15142b"/>
      <stop offset="100%" stop-color="#0b0b12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#315cff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#315cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="400" cy="190" r="260" fill="url(#glow)"/>

  <!-- Panneau central -->
  <rect x="240" y="120" width="320" height="210" rx="18" fill="#242143" stroke="#315cff" stroke-opacity="0.6"/>
  <rect x="240" y="120" width="320" height="60" rx="18" fill="#2c2850"/>
  <g fill="#f5c04a">
    <circle cx="286" cy="150" r="6"/>
    <circle cx="400" cy="150" r="6"/>
    <circle cx="514" cy="150" r="6"/>
  </g>

  <!-- Icône de mode -->
  <g transform="translate(400 250)">
    <path d="M-50 40 L-20 -30 L50 -30 L70 40 Z" fill="#315cff" opacity="0.9"/>
    <rect x="-55" y="40" width="130" height="22" rx="6" fill="#3a3755"/>
    <circle cx="-20" cy="52" r="8" fill="#0c0c14"/>
    <circle cx="20" cy="52" r="8" fill="#0c0c14"/>
  </g>

  <!-- Texte -->
  <text x="400" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="#ffffff" opacity="0.95">NOUVEAU MODE</text>

  <!-- Sol -->
  <path d="M0 340 Q400 320 800 340 L800 450 L0 450 Z" fill="#11101c"/>

  <circle cx="200" cy="140" r="3" fill="#315cff" opacity="0.8"/>
  <circle cx="600" cy="160" r="2.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="650" cy="280" r="3" fill="#315cff" opacity="0.6"/>
</svg>