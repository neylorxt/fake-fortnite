<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2233"/>
      <stop offset="50%" stop-color="#151a29"/>
      <stop offset="100%" stop-color="#0b0c12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#315cff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#315cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="400" cy="180" r="280" fill="url(#glow)"/>

  <!-- Éditeur central -->
  <rect x="180" y="80" width="440" height="280" rx="14" fill="#1a1c2c" stroke="#315cff" stroke-opacity="0.5"/>

  <!-- Barre d'outils -->
  <rect x="180" y="80" width="440" height="44" rx="14" fill="#222640"/>
  <g fill="#3a3f5c">
    <rect x="196" y="94" width="40" height="16" rx="4"/>
    <rect x="244" y="94" width="40" height="16" rx="4"/>
    <rect x="292" y="94" width="40" height="16" rx="4"/>
  </g>
  <rect x="560" y="92" width="44" height="20" rx="5" fill="#f5c04a" opacity="0.9"/>

  <!-- Scène 3D dans l'éditeur -->
  <g transform="translate(400 230)">
    <path d="M-140 60 L-60 -40 L60 -40 L140 60 Z" fill="#2c3050"/>
    <path d="M-140 60 L140 60 L140 90 L-140 90 Z" fill="#20243c"/>
    <path d="M-140 60 L60 -40 L80 -20 L-120 80 Z" fill="#343a5c"/>
    <path d="M140 60 L60 -40 L80 -20 L160 80 Z" fill="#282c4a"/>
    <rect x="-30" y="-16" width="60" height="16" rx="3" fill="#6d4cff" opacity="0.8"/>
    <rect x="-16" y="-60" width="32" height="44" rx="3" fill="#315cff" opacity="0.85"/>
    <circle cx="0" cy="-120" r="18" fill="#f5c04a" opacity="0.9"/>
  </g>

  <!-- Panneau latéral -->
  <rect x="540" y="140" width="70" height="130" rx="8" fill="#222640" stroke="#3a3f5c"/>
  <g fill="#3a3f5c">
    <circle cx="575" cy="170" r="9"/>
    <circle cx="575" cy="200" r="9"/>
    <circle cx="575" cy="230" r="9"/>
  </g>

  <!-- Lignes de code -->
  <g>
    <rect x="200" y="300" width="140" height="8" rx="4" fill="#3a3f5c"/>
    <rect x="210" y="320" width="180" height="8" rx="4" fill="#2c3050"/>
    <rect x="220" y="340" width="120" height="8" rx="4" fill="#2c3050"/>
  </g>

  <!-- Curseur -->
  <rect x="218" y="318" width="4" height="12" fill="#f5c04a" opacity="0.9"/>

  <circle cx="260" cy="110" r="3" fill="#315cff" opacity="0.7"/>
  <circle cx="620" cy="140" r="2.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="700" cy="280" r="2" fill="#ffffff" opacity="0.5"/>
</svg>