<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#20203a"/>
      <stop offset="55%" stop-color="#16162b"/>
      <stop offset="100%" stop-color="#0b0b12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#315cff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#315cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ramp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3c3852"/>
      <stop offset="100%" stop-color="#262341"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="400" cy="180" r="280" fill="url(#glow)"/>

  <!-- Sol -->
  <path d="M0 360 L800 360 L800 450 L0 450 Z" fill="#161421"/>

  <!-- Rampes géantes -->
  <path d="M60 360 L220 180 L220 360 Z" fill="url(#ramp)" stroke="#315cff" stroke-opacity="0.5"/>
  <path d="M560 360 L740 180 L740 360 Z" fill="url(#ramp)" stroke="#6d4cff" stroke-opacity="0.5"/>
  <path d="M140 220 L220 140 L300 220 Z" fill="#2c2944"/>

  <!-- Trajectoire -->
  <g stroke="#ffffff" stroke-dasharray="10 10" stroke-width="3" opacity="0.5">
    <path d="M300 260 Q400 120 560 260" fill="none"/>
  </g>

  <!-- Voiture acrobatique -->
  <g transform="translate(400 150) rotate(-20)">
    <path d="M-30 -12 Q-26 -26 -4 -28 L4 -28 Q24 -26 30 -12 L36 6 L-36 6 Z" fill="#f5c04a"/>
    <rect x="-36" y="6" width="72" height="13" rx="4" fill="#2b2a44"/>
    <circle cx="-18" cy="21" r="9" fill="#0c0c14"/>
    <circle cx="18" cy="21" r="9" fill="#0c0c14"/>
  </g>

  <!-- Poussière / vitesse -->
  <g fill="#ffffff" opacity="0.4">
    <circle cx="260" cy="280" r="3"/>
    <circle cx="240" cy="295" r="2.5"/>
    <circle cx="560" cy="280" r="3"/>
    <circle cx="580" cy="295" r="2.5"/>
  </g>

  <!-- Ciel étoilé -->
  <circle cx="160" cy="110" r="2.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="340" cy="80" r="3" fill="#ffffff" opacity="0.5"/>
  <circle cx="650" cy="100" r="2.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="720" cy="160" r="2" fill="#ffffff" opacity="0.4"/>
  <circle cx="500" cy="70" r="2" fill="#ffffff" opacity="0.5"/>
</svg>