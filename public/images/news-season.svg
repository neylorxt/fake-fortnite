<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1d45"/>
      <stop offset="50%" stop-color="#1a1233"/>
      <stop offset="100%" stop-color="#0b0a12"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffe9a0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f5c04a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d3552"/>
      <stop offset="100%" stop-color="#171425"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="400" cy="180" r="240" fill="url(#sun)"/>

  <!-- Grande montagne lumineuse -->
  <path d="M120 320 L400 90 L680 320 Z" fill="url(#land)"/>
  <path d="M400 90 L560 220 L400 220 Z" fill="#2c2750" opacity="0.7"/>
  <path d="M400 90 L260 200 L400 200 Z" fill="#262043" opacity="0.7"/>
  <path d="M360 90 L440 90 L420 60 L380 60 Z" fill="#f5c04a" opacity="0.9"/>

  <!-- Bandeaux de saison -->
  <g>
    <rect x="300" y="150" width="200" height="34" rx="6" fill="#6d4cff" opacity="0.9" transform="rotate(-4 400 167)"/>
    <text x="400" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#ffffff">SAISON 9</text>
  </g>

  <!-- Sol -->
  <path d="M0 320 Q400 300 800 320 L800 450 L0 450 Z" fill="#0e0c18"/>
  <path d="M0 350 Q200 340 400 350 T800 350 L800 450 L0 450 Z" fill="#141120" opacity="0.8"/>

  <!-- Étoiles -->
  <circle cx="160" cy="110" r="2.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="620" cy="120" r="3" fill="#ffffff" opacity="0.6"/>
  <circle cx="250" cy="180" r="2" fill="#ffffff" opacity="0.5"/>
  <circle cx="700" cy="200" r="2.5" fill="#ffffff" opacity="0.5"/>

  <!-- Particules -->
  <circle cx="360" cy="290" r="3" fill="#6d4cff" opacity="0.8"/>
  <circle cx="460" cy="280" r="2.5" fill="#f5c04a" opacity="0.8"/>
  <circle cx="420" cy="310" r="2" fill="#ffffff" opacity="0.6"/>
</svg>