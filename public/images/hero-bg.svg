<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1b28"/>
      <stop offset="55%" stop-color="#12101f"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="35%" stop-color="#f5c04a"/>
      <stop offset="100%" stop-color="#f5c04a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="storm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6d4cff" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#315cff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#315cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1a2e"/>
      <stop offset="100%" stop-color="#0b0b12"/>
    </linearGradient>
    <linearGradient id="island" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d3a4d"/>
      <stop offset="100%" stop-color="#221f33"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Horizon lumineux -->
  <ellipse cx="1150" cy="420" rx="480" ry="300" fill="url(#sun)"/>
  <ellipse cx="1150" cy="420" rx="160" ry="160" fill="#ffe9a0" opacity="0.9"/>

  <!-- Tempête violette -->
  <ellipse cx="620" cy="360" rx="380" ry="300" fill="url(#storm)"/>

  <!-- Montagnes de fond -->
  <path d="M0 620 L220 400 L430 620 Z" fill="#171525" opacity="0.9"/>
  <path d="M200 640 L520 360 L840 640 Z" fill="#1a1830" opacity="0.95"/>
  <path d="M700 640 L980 420 L1290 640 Z" fill="#191728"/>
  <path d="M1150 640 L1400 460 L1600 640 Z" fill="#161425" opacity="0.95"/>

  <!-- Sol -->
  <path d="M0 560 Q400 500 800 540 T1600 520 L1600 900 L0 900 Z" fill="url(#ground)"/>

  <!-- Île flottante -->
  <g transform="translate(620 300)">
    <path d="M-190 40 Q-150 -60 -40 -70 Q90 -80 160 -10 Q210 30 170 70 Q90 110 -80 100 Q-180 90 -190 40 Z" fill="url(#island)"/>
    <path d="M-80 -60 Q-60 -120 20 -130 Q80 -136 110 -80 Q40 -90 -30 -110 Z" fill="#45424f"/>
    <rect x="-120" y="30" width="60" height="50" rx="6" fill="#2e2b3f"/>
    <rect x="-40" y="20" width="70" height="45" rx="6" fill="#36334a"/>
    <rect x="60" y="28" width="56" height="42" rx="6" fill="#2e2b3f"/>
    <path d="M-190 40 L170 70 L175 88 L-195 58 Z" fill="#0a0a12" opacity="0.55"/>
  </g>

  <!-- Nuages -->
  <ellipse cx="300" cy="200" rx="160" ry="28" fill="#ffffff" opacity="0.07"/>
  <ellipse cx="1000" cy="180" rx="200" ry="32" fill="#ffffff" opacity="0.06"/>
  <ellipse cx="1450" cy="300" rx="150" ry="26" fill="#ffffff" opacity="0.07"/>

  <!-- Particules -->
  <circle cx="820" cy="470" r="3" fill="#ffffff" opacity="0.5"/>
  <circle cx="900" cy="500" r="2.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="760" cy="520" r="2" fill="#ffffff" opacity="0.35"/>
  <circle cx="860" cy="540" r="3.5" fill="#ffffff" opacity="0.3"/>
</svg>