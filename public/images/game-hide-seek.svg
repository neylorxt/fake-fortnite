<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d2c30"/>
      <stop offset="55%" stop-color="#152228"/>
      <stop offset="100%" stop-color="#0b0f12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#3ec9a7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3ec9a7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bush" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e5548"/>
      <stop offset="100%" stop-color="#1a3630"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4a44"/>
      <stop offset="100%" stop-color="#22312e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="400" cy="200" r="280" fill="url(#glow)"/>

  <!-- Labyrinthe vu du dessus -->
  <g stroke="#2e5548" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 140 H240 V260 H120 V380"/>
    <path d="M240 140 H480 V80 H600 V200 H480 V260 H660 V380"/>
    <path d="M600 200 H720"/>
    <path d="M120 380 H300 V320 H480"/>
    <path d="M300 380 H460"/>
  </g>
  <path d="M240 260 H420 V140" stroke="#3ec9a7" stroke-width="10" fill="none" opacity="0.7" stroke-dasharray="14 10"/>

  <!-- Cachettes (buissons) -->
  <g fill="url(#bush)">
    <circle cx="150" cy="180" r="20"/>
    <circle cx="540" cy="120" r="20"/>
    <circle cx="360" cy="350" r="20"/>
    <circle cx="660" cy="240" r="20"/>
  </g>

  <!-- Cache-cache : silhouettes -->
  <g transform="translate(250 140)">
    <circle cx="0" cy="-16" r="12" fill="#f5c04a"/>
    <rect x="-14" y="0" width="28" height="24" rx="8" fill="#f5c04a" opacity="0.9"/>
  </g>
  <g transform="translate(500 240)">
    <circle cx="0" cy="-16" r="12" fill="#315cff"/>
    <rect x="-14" y="0" width="28" height="24" rx="8" fill="#315cff" opacity="0.9"/>
  </g>

  <!-- Point d'interrogation -->
  <text x="700" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="42" fill="#f5c04a" opacity="0.9">?</text>

  <circle cx="180" cy="320" r="2.5" fill="#3ec9a7" opacity="0.7"/>
  <circle cx="620" cy="330" r="3" fill="#ffffff" opacity="0.5"/>
</svg>