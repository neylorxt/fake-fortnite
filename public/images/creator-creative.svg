<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241a45"/>
      <stop offset="50%" stop-color="#181030"/>
      <stop offset="100%" stop-color="#0b0a12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6d4cff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6d4cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="platform" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d3552"/>
      <stop offset="100%" stop-color="#1c1730"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="400" cy="180" r="280" fill="url(#glow)"/>

  <!-- Plateforme principale -->
  <path d="M100 340 Q400 300 700 340 L700 450 L100 450 Z" fill="url(#platform)"/>

  <!-- Grille holographique -->
  <g stroke="#6d4cff" stroke-opacity="0.4">
    <line x1="180" y1="300" x2="180" y2="450"/>
    <line x1="320" y1="280" x2="320" y2="450"/>
    <line x1="460" y1="270" x2="460" y2="450"/>
    <line x1="600" y1="290" x2="600" y2="450"/>
    <line x1="120" y1="380" x2="700" y2="360"/>
    <line x1="110" y1="430" x2="720" y2="410"/>
  </g>

  <!-- Éléments créatifs flottants -->
  <g transform="translate(200 200)">
    <rect x="-30" y="-30" width="60" height="60" rx="8" fill="#315cff" opacity="0.9" transform="rotate(12)"/>
    <rect x="-20" y="-20" width="40" height="40" rx="6" fill="#1a1430"/>
  </g>
  <g transform="translate(590 190)">
    <rect x="-26" y="-26" width="52" height="52" rx="8" fill="#f5c04a" opacity="0.9" transform="rotate(-10)"/>
    <rect x="-18" y="-18" width="36" height="36" rx="6" fill="#1a1430"/>
  </g>
  <g transform="translate(480 250)">
    <circle cx="0" cy="0" r="24" fill="#6d4cff" opacity="0.9"/>
    <circle cx="0" cy="0" r="14" fill="#1a1430"/>
  </g>
  <g transform="translate(300 260)">
    <path d="M-25 10 L0 -30 L25 10 Z" fill="#3ec9a7" opacity="0.85"/>
  </g>

  <!-- Plateformes secondaires -->
  <g transform="translate(130 270)">
    <rect x="-60" y="-10" width="120" height="20" rx="6" fill="#2c2750"/>
    <rect x="-30" y="-34" width="30" height="24" rx="4" fill="#3d3552"/>
  </g>
  <g transform="translate(660 280)">
    <rect x="-55" y="-10" width="110" height="18" rx="6" fill="#2c2750"/>
    <rect x="5" y="-34" width="28" height="24" rx="4" fill="#3d3552"/>
  </g>

  <!-- Lueur de construction -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.5">
    <path d="M400 330 l30 -40 l40 25 l30 -30" fill="none" stroke-dasharray="8 8"/>
  </g>

  <circle cx="260" cy="120" r="3" fill="#6d4cff" opacity="0.8"/>
  <circle cx="520" cy="130" r="2.5" fill="#f5c04a" opacity="0.7"/>
  <circle cx="640" cy="110" r="2" fill="#ffffff" opacity="0.6"/>
</svg>